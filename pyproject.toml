[build-system]
requires = ["setuptools==83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-x-ray-healthcheck"
version = "1.5.3"
description = "Health check analysis plugin for x-ray"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = ["mongo-x-ray>=1.5.3"]

[project.entry-points."x_ray.plugins"]
healthcheck = "x_ray_healthcheck.plugin:HealthcheckPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["x_ray_healthcheck*"]

[tool.setuptools.package-data]
"x_ray_healthcheck" = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]


[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

